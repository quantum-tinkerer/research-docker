name: python3
channels:
  - conda-forge
dependencies:
  # general numerics (version pinned)
  - python=3.11*
  - numpy=1.24*
  - scipy=1.11*
  - kwant>=1.4.4
  - cython=3.*
  - libblas=*=*mkl
  # numerics, not version-pinned (less mission-critical)
  - pfapack
  - adaptive
  - h5netcdf
  - xarray
  # Unpin once https://gitlab.kwant-project.org/qt/qsymm/-/issues/48 is fixed and released
  - sympy<1.12
  - sparse
  # plotting and serialization
  - deepdish
  - matplotlib-base=3.7*
  - holoviews
  - panel
  - plotly>=5.0
  - ipympl  # interactive plotting in jupyterlab
  # parallel computing
  - zarr
  - h5py
  - pytables
  - distributed=2023.3.2.1 # pin because after this version scheduler needs to have consistent env with client and workers
  - dask-jobqueue
  - dask_labextension
  - hpc05
  - dask-gateway
  # jupyter tools and extensions
  - ipython>=8
  - jupyterhub>=3.1.0
  - jupyterlab>=4.0
  - jupyter-server-proxy
  - jupyter_server>=2.2.0
  # Enable jupyter-collaboration after
  # https://github.com/jupyterlab/jupyterlab/issues/14031 and
  # https://github.com/jupyterlab/jupyterlab/issues/13930 are fixed.
  # - jupyter-collaboration
  - jupytext
  - jupyterlab-git
  - jupyterlab_code_formatter
  - jupyterlab_latex
  - jupyterlab-mathjax3
  - jupyter_bokeh
  - python-lsp-server
  - nbgitpuller
  - pyviz_comms
  - line_profiler
  - jupyter-resource-usage
  - nbdime
  - nbstripout
  - mistune
  - nbresuse
  # other
  - openfermion
  - adaptive-scheduler
  - asyncssh
  - memory_profiler
  - jax
  - black
  - boost
  - emcee
  - feedparser
  - ffmpeg
  - git
  - pymablock
  - numba
  - pandas
  - pandoc
  # - jupyter-book
  - pip
  - pytest-flakes
  - pytest-cov
  - python-graphviz
  - ruamel.yaml
  - scikit-image
  - shapely
  - alphashape
  - tqdm
  - xlrd
  - git
  - python-gitlab
  - fish
  - zsh
  - zip
  # Ensure that these packages do not get removed by python upgrade
  - conda
  - mamba
  - tini=0.18*
  # mumpy requirement
  - ninja
  - meson-python
  - pip:
    - pytest-ruff
    - git+https://github.com/basnijholt/adaptive-tools
    - git+https://gitlab.kwant-project.org/qt/dask-quantumtinkerer.git
    - git+https://gitlab.kwant-project.org/qt/Poisson_Solver.git
    - git+https://gitlab.kwant-project.org/qt/jupyterpost.git
    - git+https://github.com/Kostusas/dfttools
    - git+https://gitlab.kwant-project.org/kwant/mumpy.git@meson
    - git+https://gitlab.kwant-project.org/grenoble/pescado.git@setup
    - opencv-python-headless
    - svgutils
    - mkdocs-material
    - mkdocs-exclude


