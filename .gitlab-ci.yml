# Branches validate only. Dated release tags publish an immutable deployment
# candidate; production promotion and its runtime checks remain separate.
stages: [test, build]

patch contracts:
  stage: test
  image:
    name: quay.io/jupyter/base-notebook@sha256:49c3267842eb52c9505dba89ebac3adf142afa73feba48d0243da3c9dbdd34d1
    entrypoint: [""]
  script:
    - python -m unittest discover -s tests -p 'test_patch*.py' -v
    - python tests/source-contract.py
    - python tests/ci/export-trust.py
  artifacts:
    paths: [.ci-trust/ca-certificates.crt]
    expire_in: 1 day

build image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug@sha256:9e22d0ba2c78cffbd47e2269aa6d3dc43fc3e3ecc6b61262399279dec5e67d45
    entrypoint: [""]
  before_script:
    - sh tests/ci/kaniko-ca.test.sh /kaniko/ssl/certs/ca-certificates.crt .ci-trust/ca-certificates.crt
    - sh tests/ci/kaniko-ca.sh /kaniko/ssl/certs/ca-certificates.crt .ci-trust/ca-certificates.crt --apply
    - sh tests/ci/kaniko-native.test.sh
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR/image
      --dockerfile $CI_PROJECT_DIR/image/Dockerfile
      --no-push
      --no-push-cache
      --reproducible
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-[0-9]{8}(-[0-9]+)?$/'
      when: never
    - when: on_success

publish image:
  extends: build image
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-[0-9]{8}(-[0-9]+)?$/'
  script:
    - |
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/image
      --dockerfile $CI_PROJECT_DIR/image/Dockerfile
      --destination $CI_REGISTRY_IMAGE/combined:$CI_COMMIT_TAG
      --cache=false
      --compressed-caching=false
      --reproducible
      --digest-file image-digest.txt
  artifacts:
    paths: [image-digest.txt]
    expire_in: 1 year
