# Human-readable intent; security/conda-linux-64.lock is the build input.
name: python3
channels:
  - conda-forge
dependencies:
  # October 2026 eMudhra root distrust, including Python requests/certifi.
  - ca-certificates>=2026.10.19
  - certifi>=2026.10.19
  # plotting and serialization
  - panel
  - plotly>=5.0
  - ipympl  # interactive plotting in jupyterlab
  # parallel computing
  # jupyter tools and extensions
  - jupyter-server-proxy
  - jupyter_server>=2.21.1
  - jupyter-vscode-proxy
  - dask_labextension
  - jupytext=1.19.6
  - jupyterlab=4.6.5
  - jupyterlab-git
  - jupyterlab_code_formatter=3.1.0
  - jupyterlab_latex
  - jupyter-collaboration
  - jupyterlab-mathjax3
  - jupyterlab-lsp
  - jupyter_bokeh
  - python-lsp-server
  - nbgitpuller
  - pyviz_comms
  - line_profiler
  - jupyter-resource-usage
  - nbdime
  - nbresuse
  # OpenVSCode is installed from the digest-verified official archive.
  # other
  - memory_profiler
  - black
  - git
  - pandoc
  - pip>=26.2.2
  - ruamel.yaml
  - fish
  - zsh
  - zip
  # Ensure that these packages do not get removed by python upgrade
  - conda
  - mamba
  - tini=0.18*
  # Jupyter integration for the user-installed Pixi executable
  - pixi-kernel
  - pip:
    - git+https://gitlab.kwant-project.org/qt/jupyterpost.git
    - jupyter-sshd-proxy
    - jupyter_server_nbmodel[lab]
