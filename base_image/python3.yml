name: python3
channels:
  - conda-forge
dependencies:
  # general numerics (version pinned)
  - python=3.12.*
  # numerics, not version-pinned (less mission-critical)
  # plotting and serialization
  - panel
  - plotly>=5.0
  - ipympl  # interactive plotting in jupyterlab
  # parallel computing
  - dask_labextension
  # jupyter tools and extensions
  - jupyterhub>=4.0
  - jupyterlab>=4.1
  - jupyter-server-proxy
  - jupyter_server>=2.2.0
  - jupyter-vscode-proxy
  - openvscode-server
  - jupytext
  - jupyterlab-git
  - jupyterlab_code_formatter
  - jupyterlab_latex
  - jupyterlab-mathjax3
  - jupyter_bokeh
  - python-lsp-server
  - nbgitpuller
  - pyviz_comms
  - line_profiler
  - jupyter-resource-usage
  - nbdime
  - nbstripout
  - mistune
  - nbresuse
  # other
  - asyncssh
  - memory_profiler
  - black
  - git
  - pandoc
  - pip
  - ruamel.yaml
  - fish
  - zsh
  - zip
  # Ensure that these packages do not get removed by python upgrade
  - conda
  - mamba
  - tini=0.18*
  # mumpy requirementz
  # pixi environment
  - pixi
  - pixi-kernel
  - pip:
    - pytest-ruff
    - git+https://gitlab.kwant-project.org/qt/jupyterpost.git
